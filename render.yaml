services:
  - type: web
    name: capstone-market-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://capstone-market.vercel.app
      # private file storage for CVs and report files (Supabase Storage, private bucket)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: capstone-files
      # AI Project Analyzer (Phase 2 - Gemini Flash)
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_ID
        value: "gemini-3.8-flash"
      - key: AI_PROVIDER
        value: "gemini"
      - key: AI_ANALYSIS_TIMEOUT_SEC
        value: "12"
      - key: AI_ANALYSIS_MAX_RPM
        value: "10"

